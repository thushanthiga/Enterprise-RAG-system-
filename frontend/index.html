<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errDiv = document.createElement('div');
        errDiv.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(200,0,0,0.9);color:white;z-index:99999;padding:2rem;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = "CRASH DETECTED:\n\n" + message + "\n\n" + (error ? error.stack : '');
        document.body.appendChild(errDiv);
      };
      window.onunhandledrejection = function(event) {
        var errDiv = document.createElement('div');
        errDiv.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(200,0,0,0.9);color:white;z-index:99999;padding:2rem;font-family:monospace;white-space:pre-wrap;overflow:auto;';
        errDiv.innerText = "PROMISE CRASH:\n\n" + event.reason;
        document.body.appendChild(errDiv);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
